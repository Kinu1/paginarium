services:
  - type: web
    name: paginarium-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }
      - { key: FIREBASE_PROJECT_ID, sync: false }
      - { key: WEB_ORIGIN, sync: false }
