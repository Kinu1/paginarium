name: Verificação da interface
on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', '.github/workflows/interface.yml']
  pull_request:
    paths: ['web/**', 'shared/**', '.github/workflows/interface.yml']
permissions:
  contents: read
jobs:
  estante:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test src/diario/diario.test.mjs src/annual/annual.test.mjs
