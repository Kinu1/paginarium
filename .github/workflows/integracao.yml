name: Integração com Docker
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build --wait
      - run: npm run test:browser
      - run: node infra/testar-restauracao.mjs
      - if: always()
        run: docker compose down
